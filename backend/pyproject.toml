[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecdat-backend"
version = "0.1.0"
description = "ECDAT API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["api", "schemas", "services", "models"]
